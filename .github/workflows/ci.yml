name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: black --check .

      - name: Tests (unit, UI smoke, MySQL integration)
        env:
          SLAB_TEST_MYSQL: '1'
          SLAB_TEST_MYSQL_HOST: 127.0.0.1
          SLAB_TEST_MYSQL_USER: root
          SLAB_TEST_MYSQL_PASSWORD: testpass
        run: xvfb-run -a pytest -q
